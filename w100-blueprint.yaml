blueprint:
  name: Aqara W100 Thermostat Synchronization
  description: |
    Synchronizes an Aqara W100 climate controller with a main thermostat entity.
    Supports bidirectional sync for HVAC mode, temperature, and fan mode.
    Optionally publishes external temperature and humidity data to the W100 display.
    Configure which HVAC modes and features your system supports.
  domain: automation
  
  input:
    main_thermostat:
      name: Main Thermostat
      description: The primary thermostat entity to sync with
      selector:
        entity:
          domain: climate
    aqara_w100:
      name: Aqara W100 Climate Controller
      description: The Aqara W100 climate entity
      selector:
        entity:
          domain: climate
    hvac_has_heat:
      name: Heating Support
      description: Enable if your HVAC system supports heating mode
      default: true
      selector:
        boolean:
    hvac_has_cool:
      name: Cooling Support
      description: Enable if your HVAC system supports cooling mode
      default: false
      selector:
        boolean:
    hvac_has_auto:
      name: Auto Mode Support
      description: Enable if your HVAC system supports automatic mode
      default: false
      selector:
        boolean:
    hvac_has_vent:
      name: Fan Mode Support
      description: Enable if your HVAC system supports fan mode control
      default: false
      selector:
        boolean:
    sync_delay:
      name: Synchronization Delay
      description: Delay between sync commands (in seconds)
      default: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: seconds
    enable_external_data:
      name: Enable External Data Publishing
      description: Publish external temperature and humidity to W100 display
      default: false
      selector:
        boolean:
    external_temperature_sensor:
      name: External Temperature Sensor
      description: Temperature sensor to publish to W100 (optional)
      default: []
      selector:
        entity:
          domain: sensor
          device_class: temperature
    external_humidity_sensor:
      name: External Humidity Sensor
      description: Humidity sensor to publish to W100 (optional)
      default: []
      selector:
        entity:
          domain: sensor
          device_class: humidity
    external_temperature_threshold:
      name: External Temperature Change Threshold
      description: >-
        Publish the external temperature only when it differs from the value
        the W100 already has by at least this much, rounded to this step.
        Fewer writes to a battery-powered W100 mean fewer failed deliveries
        and longer battery life.
      default: 0.1
      selector:
        number:
          min: 0.01
          max: 2
          step: 0.01
          unit_of_measurement: "°"
          mode: box
    external_humidity_threshold:
      name: External Humidity Change Threshold
      description: >-
        Publish the external humidity only when it differs from the value
        the W100 already has by at least this much, rounded to this step.
      default: 1
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: "%"
          mode: box

variables:
  main_thermostat: !input main_thermostat
  aqara_w100: !input aqara_w100
  hvac_has_heat: !input hvac_has_heat
  hvac_has_cool: !input hvac_has_cool
  hvac_has_auto: !input hvac_has_auto
  hvac_has_vent: !input hvac_has_vent
  sync_delay: !input sync_delay
  enable_external_data: !input enable_external_data
  external_temperature_sensor: !input external_temperature_sensor
  external_humidity_sensor: !input external_humidity_sensor
  external_temperature_threshold: !input external_temperature_threshold
  external_humidity_threshold: !input external_humidity_threshold
  thermostat_mode_switch: >-
    {{ 'switch.' ~ aqara_w100.split('.')[1] ~ '_thermostat_mode' }}
  # Names different climate integrations use for the middle fan speed.
  # They are treated as the same speed when syncing in either direction.
  fan_medium_aliases:
    - medium
    - mid
    - med
    - middle

triggers:
  - trigger: state
    entity_id: !input main_thermostat
    id: climate_state
  - trigger: state
    entity_id: !input aqara_w100
    id: w100_climate_state
  - trigger: state
    entity_id: !input external_temperature_sensor
    id: ext_temp
    enabled: !input enable_external_data
  - trigger: state
    entity_id: !input external_humidity_sensor
    id: ext_hum
    enabled: !input enable_external_data

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - climate_state
          - condition: template
            value_template: >-
              {{ is_state(thermostat_mode_switch, 'on') }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ states(main_thermostat) != states(aqara_w100) }}
              - condition: template
                value_template: >-
                  {{ is_state(thermostat_mode_switch, 'on') }}
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input aqara_w100
                data:
                  hvac_mode: |
                    {{ states(main_thermostat) }}
              - delay:
                  seconds: "{{ sync_delay }}"
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(main_thermostat, "temperature") !=
                  state_attr(aqara_w100, "temperature") }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: !input aqara_w100
                data:
                  temperature: |
                    {{ state_attr(main_thermostat, "temperature") }}
              - delay:
                  seconds: "{{ sync_delay }}"
          # Fan mode: main thermostat -> W100.
          # fan_to_send is the W100's own name for the main thermostat's
          # speed, or '' when they already match or the W100 has no such speed.
          - variables:
              fan_to_send: >-
                {%- set src = (state_attr(main_thermostat, 'fan_mode') or '') | string | lower -%}
                {%- set cur = (state_attr(aqara_w100, 'fan_mode') or '') | string | lower -%}
                {%- set src_key = 'medium' if src in fan_medium_aliases else src -%}
                {%- set cur_key = 'medium' if cur in fan_medium_aliases else cur -%}
                {%- set ns = namespace(match='') -%}
                {%- for m in state_attr(aqara_w100, 'fan_modes') or [] -%}
                  {%- set m_key = 'medium' if (m | string | lower) in fan_medium_aliases else (m | string | lower) -%}
                  {%- if ns.match == '' and m_key == src_key -%}{%- set ns.match = m -%}{%- endif -%}
                {%- endfor -%}
                {{- ns.match if (src_key != '' and src_key != cur_key) else '' -}}
          - if:
              - condition: template
                value_template: >-
                  {{ (hvac_has_vent | default(false) | bool) and fan_to_send != '' }}
            then:
              - action: climate.set_fan_mode
                target:
                  entity_id: !input aqara_w100
                data:
                  fan_mode: "{{ fan_to_send }}"
              - delay:
                  seconds: "{{ sync_delay }}"

      - conditions:
          - condition: trigger
            id:
              - w100_climate_state
          - condition: template
            value_template: >-
              {{ is_state(thermostat_mode_switch, 'on') }}
        sequence:
          - if:
              - condition: template
                value_template: |
                  {{
                    (states(main_thermostat) != states(aqara_w100)) and
                    (
                      (is_state(aqara_w100, 'heat') and (hvac_has_heat | default(false) | bool)) or
                      (is_state(aqara_w100, 'cool') and (hvac_has_cool | default(false) | bool)) or
                      (is_state(aqara_w100, 'auto') and (hvac_has_auto | default(false) | bool)) or
                      (is_state(aqara_w100, 'off'))
                    )
                  }}
            then:
              - action: climate.set_hvac_mode
                data:
                  hvac_mode: |
                    {{ states(aqara_w100) }}
                target:
                  entity_id: !input main_thermostat
              - delay:
                  seconds: "{{ sync_delay }}"
            else:
              - if:
                  - condition: template
                    value_template: |
                      {{
                        (is_state(aqara_w100, 'heat') and not (hvac_has_heat | default(false) | bool)) or
                        (is_state(aqara_w100, 'cool') and not (hvac_has_cool | default(false) | bool)) or
                        (is_state(aqara_w100, 'auto') and not (hvac_has_auto | default(false) | bool))
                      }}
                then:
                  - action: climate.set_hvac_mode
                    metadata: {}
                    data:
                      hvac_mode: heat
                    target:
                      entity_id: !input aqara_w100
                  - delay:
                      seconds: "{{ sync_delay }}"
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(main_thermostat, "temperature") !=
                  state_attr(aqara_w100, "temperature") }}
            then:
              - action: climate.set_temperature
                data:
                  temperature: |
                    {{ state_attr(aqara_w100, "temperature") }}
                target:
                  entity_id: !input main_thermostat
              - delay:
                  seconds: "{{ sync_delay }}"
          # Fan mode: W100 -> main thermostat.
          # fan_to_send is the main thermostat's own name for the W100's
          # speed (e.g. "medium" -> "mid"), or '' when they already match
          # or the main thermostat has no such speed.
          - variables:
              fan_to_send: >-
                {%- set src = (state_attr(aqara_w100, 'fan_mode') or '') | string | lower -%}
                {%- set cur = (state_attr(main_thermostat, 'fan_mode') or '') | string | lower -%}
                {%- set src_key = 'medium' if src in fan_medium_aliases else src -%}
                {%- set cur_key = 'medium' if cur in fan_medium_aliases else cur -%}
                {%- set ns = namespace(match='') -%}
                {%- for m in state_attr(main_thermostat, 'fan_modes') or [] -%}
                  {%- set m_key = 'medium' if (m | string | lower) in fan_medium_aliases else (m | string | lower) -%}
                  {%- if ns.match == '' and m_key == src_key -%}{%- set ns.match = m -%}{%- endif -%}
                {%- endfor -%}
                {{- ns.match if (src_key != '' and src_key != cur_key) else '' -}}
          - if:
              - condition: template
                value_template: >-
                  {{ (hvac_has_vent | default(false) | bool) and fan_to_send != '' }}
            then:
              - action: climate.set_fan_mode
                target:
                  entity_id: !input main_thermostat
                data:
                  fan_mode: "{{ fan_to_send }}"
              - delay:
                  seconds: "{{ sync_delay }}"

      - conditions:
          - condition: trigger
            id:
              - ext_temp
              - ext_hum
          - condition: template
            value_template: "{{ enable_external_data }}"
        sequence:
          # Each value is sent only when it has moved at least its threshold
          # away from what the W100 already has, and is rounded to that step.
          # A sensor that reports every 0.01 change would otherwise write to
          # the W100 every few seconds; on battery the W100 only picks up
          # writes when it wakes, so many fail ("Delivery failed" in Z2M) and
          # the battery drains. A failed write leaves the W100's number
          # unchanged, so the next sensor update retries it.
          # *_to_send is the rounded value to send, or '' to skip.
          - variables:
              ext_temp_entity: "{{ 'number.' ~ aqara_w100.split('.')[1] ~ '_external_temperature' }}"
              ext_temp_to_send: >-
                {%- set new = states(external_temperature_sensor) | float(none) -%}
                {%- set cur = states(ext_temp_entity) | float(none) -%}
                {%- set step = external_temperature_threshold | float(0.1) -%}
                {%- if new is not none and (cur is none or (new - cur) | abs >= step - 0.001) -%}
                  {{- ((new / step) | round(0) * step) | round(2) -}}
                {%- endif -%}
          - if:
              - condition: template
                value_template: "{{ ext_temp_to_send != '' }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "{{ ext_temp_entity }}"
                data:
                  value: "{{ ext_temp_to_send }}"
              - delay:
                  seconds: "{{ sync_delay }}"
          - variables:
              ext_hum_entity: "{{ 'number.' ~ aqara_w100.split('.')[1] ~ '_external_humidity' }}"
              ext_hum_to_send: >-
                {%- set new = states(external_humidity_sensor) | float(none) -%}
                {%- set cur = states(ext_hum_entity) | float(none) -%}
                {%- set step = external_humidity_threshold | float(1) -%}
                {%- if new is not none and (cur is none or (new - cur) | abs >= step - 0.001) -%}
                  {{- ((new / step) | round(0) * step) | round(2) -}}
                {%- endif -%}
          - if:
              - condition: template
                value_template: "{{ ext_hum_to_send != '' }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "{{ ext_hum_entity }}"
                data:
                  value: "{{ ext_hum_to_send }}"
              - delay:
                  seconds: "{{ sync_delay }}"

mode: queued
max: 10

# External sensor updates start a run every few seconds, which would push
# the W100 and thermostat runs out of the default 5 stored traces.
trace:
  stored_traces: 20
